<svg width="256" height="256" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A874"/>
      <stop offset="0.5" stop-color="#B98C55"/>
      <stop offset="1" stop-color="#8B6239"/>
    </linearGradient>
  </defs>

  <!-- 木質圓角徽章底 -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#wood)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="#6E4B2A" stroke-width="1.2" opacity="0.35"/>

  <!-- 莖（鼠尾草綠，簡化為單一粗線條以利小尺寸辨識） -->
  <path d="M32 52 L32 30" stroke="#5C6B44" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- 鬱金香花頭（奶油白，加大加粗的塊狀剪影） -->
  <path d="M32 33
           C 18 33, 14 18, 23 8
           C 27 14, 30 18, 32 21
           C 34 18, 37 14, 41 8
           C 50 18, 46 33, 32 33
           Z" fill="#FBF6EC" stroke="#A85963" stroke-width="2.2" stroke-linejoin="round"/>
</svg>
